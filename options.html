<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>조준경 - AI 설정</title>
  <style>
    body {
      width: 460px;
      margin: 0;
      padding: 20px;
      font-family: "Roboto", "Noto Sans KR", sans-serif;
      color: #111;
      background: #fafafa;
    }
    h1 {
      font-size: 17px;
      margin: 0 0 6px;
      color: #cc0000;
    }
    p {
      font-size: 12px;
      color: #555;
      margin: 0 0 16px;
      line-height: 1.6;
    }
    .jjg-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .jjg-card h2 {
      font-size: 14px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin: 10px 0 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    button {
      padding: 10px 20px;
      background: #cc0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #aa0000;
    }
    #jjg-saved-msg {
      font-size: 12px;
      color: #2e7d32;
      margin-top: 8px;
      text-align: center;
      display: none;
      font-weight: 600;
    }
    .badge {
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>조준경 AI 2차 분석 엔진 설정</h1>
  <p>1차 로컬 AI(0.3ms)로 기본 판정하며, 2차 정밀 분석(자막/대사 전체 검증)을 위해 Cloud AI 또는 로컬 Ollama를 사용합니다.</p>

  <div class="jjg-card">
    <h2>⚡ Google Gemini API <span class="badge">추천 (초고속)</span></h2>
    <p>Gemini 2.0 Flash 모델을 연동하여 영상의 <b>전체 자막/대사 텍스트</b>를 200ms 만에 분석합니다.</p>
    <label for="jjg-gemini-key">Gemini API Key</label>
    <input id="jjg-gemini-key" type="password" placeholder="AIzaSy..." />
  </div>

  <div class="jjg-card">
    <h2>🦙 로컬 Ollama LLM <span class="badge">오프라인</span></h2>
    <p>로컬에 설치된 Ollama 서버를 사용할 경우 설정하세요.</p>
    <label for="jjg-ollama-url">Ollama URL</label>
    <input id="jjg-ollama-url" type="text" placeholder="http://localhost:11434" />
    <label for="jjg-ollama-model">모델 이름</label>
    <input id="jjg-ollama-model" type="text" placeholder="예: llama3.1" />
  </div>

  <button id="jjg-save-btn">설정 저장하기</button>
  <div id="jjg-saved-msg">저장되었습니다! ✓</div>

  <script src="options.js"></script>
</body>
</html>
