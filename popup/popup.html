<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>조준경 - 세션 리포트</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: "Roboto", "Noto Sans KR", sans-serif;
      color: #111;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    .jjg-purpose {
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
      word-break: break-all;
    }
    .jjg-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .jjg-stat {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }
    .jjg-stat .num {
      font-size: 20px;
      font-weight: 700;
    }
    .jjg-stat .label {
      font-size: 11px;
      color: #666;
    }
    #jjg-chain {
      font-size: 12px;
      line-height: 1.9;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 14px;
    }
    .jjg-chain-item {
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: #fafafa;
    }
    .jjg-chain-item.left {
      background: #fff1f0;
      border: 1px solid #ffccc7;
    }
    .jjg-chain-item.skipped {
      background: #fff9e6;
      border: 1px solid #ffe69c;
    }
    .jjg-chain-item.approved {
      background: #f0f7ff;
      border: 1px solid #b3d8ff;
    }
    .jjg-chain-item.prevented {
      background: #edf7ed;
      border: 1px solid #b7dfb9;
    }
    .jjg-chain-item.blocked {
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
    }
    .jjg-chain-arrow {
      text-align: center;
      color: #aaa;
      font-size: 11px;
    }
    .jjg-empty {
      font-size: 12px;
      color: #888;
      padding: 20px 0;
      text-align: center;
    }
    .jjg-report-panel {
      border-top: 1px solid #e5e5e5;
      padding-top: 14px;
    }
    .jjg-report-panel h2 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    .jjg-report-button {
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #cc0000;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .jjg-report-button.secondary {
      margin-top: 10px;
      background: #f1f1f1;
      color: #333;
    }
    .jjg-report-button:disabled {
      cursor: default;
      opacity: 0.55;
    }
    .jjg-report-loading,
    .jjg-report-error {
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
    }
    .jjg-report-loading {
      background: #f5f5f5;
      color: #555;
    }
    .jjg-report-error {
      background: #fff1f0;
      color: #8a1c17;
    }
    #jjg-report-output {
      max-height: 310px;
      overflow-y: auto;
      padding-right: 3px;
    }
    .jjg-report-section {
      margin: 0 0 8px;
      padding: 9px 10px;
      border-radius: 7px;
      background: #fafafa;
    }
    .jjg-report-section.prominent {
      background: #fff5f5;
      border-left: 3px solid #cc0000;
    }
    .jjg-report-section h3 {
      margin: 0 0 4px;
      font-size: 12px;
    }
    .jjg-report-section p,
    .jjg-report-section ul,
    .jjg-report-section ol {
      margin: 0;
      color: #444;
      font-size: 11.5px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .jjg-report-section ul,
    .jjg-report-section ol {
      padding-left: 18px;
    }
    .jjg-next-rule {
      margin-bottom: 3px;
      font-weight: 600;
    }
    .jjg-next-rule-evidence {
      margin-bottom: 8px;
      color: #666;
      font-size: 10.5px;
      line-height: 1.45;
    }
    .jjg-report-metric {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
      font-size: 11.5px;
    }
    .jjg-report-metric-value { flex: 0 0 auto; font-weight: 600; }
    .jjg-timeline-item {
      min-width: 0;
      padding: 6px 7px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      background: #fff;
    }
    .jjg-timeline-title,
    .jjg-timeline-meta,
    .jjg-timeline-arrow { overflow-wrap: anywhere; font-size: 11px; }
    .jjg-timeline-title { font-weight: 600; }
    .jjg-timeline-meta { margin-top: 3px; color: #666; }
    .jjg-timeline-arrow { padding: 5px 3px; color: #777; }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>이번 세션 리포트</h1>
  <div class="jjg-purpose" id="jjg-purpose">목적: -</div>
  <div class="jjg-stats">
    <div class="jjg-stat">
      <div class="num" id="jjg-total">0</div>
      <div class="label">총 시청 영상</div>
    </div>
    <div class="jjg-stat">
      <div class="num" id="jjg-leaves">0</div>
      <div class="label">이탈 횟수</div>
    </div>
    <div class="jjg-stat">
      <div class="num" id="jjg-approved">0</div>
      <div class="label">이유 승인</div>
    </div>
    <div class="jjg-stat">
      <div class="num" id="jjg-skipped">0</div>
      <div class="label">판정 건너뜀</div>
    </div>
    <div class="jjg-stat">
      <div class="num" id="jjg-blocked">0</div>
      <div class="label">차단됨</div>
    </div>
  </div>
  <div id="jjg-chain"></div>
  <div class="jjg-report-panel">
    <h2>AI 이탈 리포트</h2>
    <button class="jjg-report-button" id="jjg-report-generate">AI 이탈 리포트 생성</button>
    <div class="jjg-report-loading" id="jjg-report-loading" hidden>
      AI가 시청 경로를 분석하고 있어요...
    </div>
    <div class="jjg-report-error" id="jjg-report-error" hidden>
      <div id="jjg-report-error-message"></div>
      <button class="jjg-report-button secondary" id="jjg-report-retry">다시 시도</button>
    </div>
    <div id="jjg-report-content" hidden>
      <div id="jjg-report-output"></div>
      <button class="jjg-report-button secondary" id="jjg-report-regenerate">리포트 다시 생성</button>
    </div>
  </div>
  <script src="../shared/schema.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/report-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
