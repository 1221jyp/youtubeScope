<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>조준경 - 설정</title>
  <style>
    body {
      width: 440px;
      margin: 0;
      padding: 20px;
      font-family: "Roboto", "Noto Sans KR", sans-serif;
      color: #111;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 6px;
    }
    p {
      font-size: 12px;
      color: #555;
      margin: 0 0 16px;
      line-height: 1.6;
    }
    a {
      color: #cc0000;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 16px;
      background: #cc0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #jjg-saved-msg {
      font-size: 12px;
      color: #2e7d32;
      margin-left: 10px;
      display: none;
    }
    .jjg-note {
      background: #fff9e6;
      border: 1px solid #ffe69c;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11.5px;
      color: #664d03;
      margin-bottom: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>조준경 설정 (Gemini)</h1>
  <p>영상 판정에 Google Gemini API를 사용합니다. 판정 시 영상 제목/설명 등이
    Google Gemini API로 전송됩니다.</p>

  <div class="jjg-note">
    ⚠️ API 키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>에서
    발급받으세요. 입력한 키는 이 브라우저의 저장소에만 보관됩니다.
  </div>

  <label for="jjg-gemini-key">Gemini API 키</label>
  <input id="jjg-gemini-key" type="password" placeholder="AIza..." autocomplete="off" />

  <label for="jjg-gemini-model">모델 이름</label>
  <input id="jjg-gemini-model" type="text" placeholder="gemini-flash-latest" />

  <button id="jjg-save-btn">저장</button>
  <span id="jjg-saved-msg">저장됨 ✓</span>
  <script src="../shared/schema.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
